<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Contact — Get in touch with me." />
  <title>Contact Me ✉️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Ambient orbs -->
  <div class="orb orb-1" aria-hidden="true"></div>
  <div class="orb orb-2" aria-hidden="true"></div>
  <div class="orb orb-3" aria-hidden="true"></div>

  <!-- Navigation -->
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <a href="index.html" class="nav-logo">✦ MySpace</a>
    <ul class="nav-links" role="list">
      <li><a href="index.html" class="nav-link" id="nav-home">Home</a></li>
      <li><a href="about.html" class="nav-link" id="nav-about">About</a></li>
      <li><a href="contact.html" class="nav-link active" id="nav-contact">Contact</a></li>
    </ul>
  </nav>

  <!-- Main content -->
  <main class="page-content" role="main">

    <!-- Hero -->
    <section class="about-hero animate-pop" aria-labelledby="contact-heading">
      <div class="avatar" aria-hidden="true">✉️</div>
      <h1 id="contact-heading">Get In Touch</h1>
      <p class="subtitle">I'd love to hear from you — let's connect!</p>
    </section>

    <!-- Contact form -->
    <section class="card about-card animate-pop delay-1" aria-label="Contact form">
      <h2 class="section-title">Send a Message</h2>
      <form id="contact-form" class="contact-form" novalidate>

        <div class="form-row">
          <div class="form-group">
            <label for="contact-name" class="form-label">Full Name</label>
            <input
              type="text"
              id="contact-name"
              name="name"
              class="form-input"
              placeholder="John Doe"
              required
              autocomplete="name"
            />
          </div>
          <div class="form-group">
            <label for="contact-email" class="form-label">Email Address</label>
            <input
              type="email"
              id="contact-email"
              name="email"
              class="form-input"
              placeholder="john@example.com"
              required
              autocomplete="email"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="contact-subject" class="form-label">Subject</label>
          <input
            type="text"
            id="contact-subject"
            name="subject"
            class="form-input"
            placeholder="What's this about?"
            required
          />
        </div>

        <div class="form-group">
          <label for="contact-message" class="form-label">Message</label>
          <textarea
            id="contact-message"
            name="message"
            class="form-input form-textarea"
            placeholder="Write your message here…"
            rows="5"
            required
          ></textarea>
        </div>

        <button type="submit" class="btn btn-full" id="submit-btn">
          Send Message ✉️
        </button>

        <!-- Success message (hidden by default) -->
        <div id="success-msg" class="success-msg" role="alert" aria-live="polite" hidden>
          🎉 Thanks! Your message has been sent successfully.
        </div>
      </form>
    </section>

    <!-- Contact info cards -->
    <section class="stats-row animate-pop delay-2" aria-label="Contact information">
      <div class="stat-card info-card">
        <span class="info-icon">📍</span>
        <span class="stat-label">Birmingham, UK</span>
      </div>
      <div class="stat-card info-card">
        <span class="info-icon">🏫</span>
        <span class="stat-label">BCU Student</span>
      </div>
      <div class="stat-card info-card">
        <span class="info-icon">⏰</span>
        <span class="stat-label">Replies in 24h</span>
      </div>
    </section>

  </main>

  <script>
    document.getElementById('contact-form').addEventListener('submit', function (e) {
      e.preventDefault();

      const btn = document.getElementById('submit-btn');
      const successMsg = document.getElementById('success-msg');

      // Button loading state
      btn.textContent = 'Sending…';
      btn.disabled = true;
      btn.style.opacity = '0.7';

      // Simulate async send
      setTimeout(function () {
        btn.textContent = '✓ Sent!';
        btn.style.background = 'linear-gradient(135deg, #059669, #10b981)';
        successMsg.hidden = false;
        document.getElementById('contact-form').reset();
      }, 1200);
    });
  </script>

</body>
</html>
